<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderator Portal | ZCFK Election 2026</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <img src="logo.png" alt="ZCFK Official Emblem" class="logo">

            <div class="header-text">
                <h1>ZOMI CHRISTIAN FELLOWSHIP KOLKATA</h1>
                <p>Election 2026 | Term 2027–2029</p>
                <p class="motto">"LET YOUR LIGHT SHINE"</p>
            </div>
        </div>
    </header>

    <nav>
        <a href="index.html">Home</a>
    </nav>

    <main class="candidate-page">

        <h2>Moderator Portal</h2>

        <p class="candidate-subtitle">
            Authorized access only. Please sign in to continue.
        </p>

        <div class="verification-box">

            <h3>Moderator Login</h3>

            <form id="moderator-login-form">

                <label for="moderator-id">Moderator ID</label>

                <input
                    type="text"
                    id="moderator-id"
                    placeholder="Enter Moderator ID"
                    required
                >

                <label for="moderator-password">Password</label>

                <input
                    type="password"
                    id="moderator-password"
                    placeholder="Enter Password"
                    required
                >

                <button type="submit">
                    Sign In
                </button>

            </form>

            <p class="verification-note">
                This portal is restricted to authorized election moderators.
            </p>

        </div>

    </main>

    <footer>
        <p>&copy; 2026 Zomi Christian Fellowship Kolkata</p>
    </footer>

</body>
</html>
